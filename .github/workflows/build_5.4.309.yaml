name: Build 9RT Kernel 5.4.309 (Docker, KSU disabled)

on:
  workflow_dispatch:
  push:
    branches: [ martini-5.4.309 ]

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Make Build Environment
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y kmod cpio binutils cmake binutils-aarch64-linux-gnu git wget pahole automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen minicom bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip dwarves device-tree-compiler python3 ccache imagemagick libelf-dev libncurses5-dev libsdl1.2-dev gpart fuse2fs e2fsck-static rsync adb fastboot libstdc++6 python-is-python3 gcc-aarch64-linux-gnu
          mkdir -p kernel

      - name: Checkout Kernel Source
        uses: actions/checkout@v6
        with:
          repository: one899/android_kernel_oneplus_sm8350_5.4.309
          path: kernel/msm-5.4
          ref: martini-5.4.309
          fetch-depth: 1

      - name: Disable KSU (comment out Kconfig source)
        run: |
          cd kernel/msm-5.4
          echo '=== 改动前 ==='
          grep -n 'kernelsu' drivers/Kconfig drivers/Makefile || true
          sed -i 's|^source "drivers/kernelsu/Kconfig"|# source "drivers/kernelsu/Kconfig"  # KSU disabled|' drivers/Kconfig
          sed -i '/CONFIG_KSU.*kernelsu/d' drivers/Makefile
          echo '=== 改动后 ==='
          grep -n 'kernelsu' drivers/Kconfig drivers/Makefile || echo '  (已无引用)'

      - name: Checkout Modules Source
        uses: actions/checkout@v6
        with:
          repository: one899/android_kernel_modules_and_devicetree_oneplus_sm8350_5.4.309
          path: temp_modules
          ref: martini-5.4.309
          fetch-depth: 1

      - name: Prepare Compiler
        run: |
          mkdir -p compiler/clang-bin
          cd compiler
          curl -fL 'https://github.com/Rancemxn/android_kernel_oppo_sm7325/releases/download/BuildTool/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz' -o clang-r383902.tar.gz --connect-timeout 30 --retry 5 --retry-delay 5
          tar -xzf clang-r383902.tar.gz -C clang-bin
          rm -f clang-r383902.tar.gz
          ls clang-bin/bin | head -3

      - name: Handle Dependencies
        run: |
          set -e
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          echo '=== 补齐 techpack (内核仓库里是空的 gitlink) ==='
          for d in audio camera dataipa display video; do
            rm -rf "kernel/msm-5.4/techpack/$d"
            cp -a "temp_modules/kernel/msm-5.4/techpack/$d" "kernel/msm-5.4/techpack/$d"
            echo "  techpack/$d : $(find kernel/msm-5.4/techpack/$d -type f | wc -l) 个文件"
          done
          echo '=== 挂载 QCA WLAN 驱动 (qcacld-3.0) ==='
          W=vendor/qcom/opensource/wlan
          test -d "$W" && echo "  ✓ 驱动目录存在: $W" || { echo "  ✗ 不存在: $W"; ls -la vendor/qcom/opensource/ 2>&1; exit 1; }
          for d in qcacld-3.0 qca-wifi-host-cmn fw-api; do
            rm -rf "kernel/msm-5.4/drivers/staging/$d"
            cp -a "$W/$d" "kernel/msm-5.4/drivers/staging/$d"
            echo "  drivers/staging/$d : $(find kernel/msm-5.4/drivers/staging/$d -type f | wc -l) 个文件"
          done
          rm -rf temp_modules
          test -f kernel/msm-5.4/techpack/audio/Makefile && echo 'OK: techpack/audio/Makefile 存在' || { echo 'FAIL: techpack 缺失'; exit 1; }
          test -f kernel/msm-5.4/drivers/staging/qcacld-3.0/Kbuild && echo 'OK: qcacld-3.0/Kbuild 存在' || { echo 'FAIL: qcacld 缺失'; exit 1; }
          echo '=== 接线 drivers/staging/{Kconfig,Makefile} ==='
          cd kernel/msm-5.4
          grep -q 'qcacld-3.0/Kconfig' drivers/staging/Kconfig || echo 'source "drivers/staging/qcacld-3.0/Kconfig"' >> drivers/staging/Kconfig
          grep -q 'qcacld-3.0/' drivers/staging/Makefile || echo 'obj-$(CONFIG_QCA_CLD_WLAN) += qcacld-3.0/' >> drivers/staging/Makefile
          tail -2 drivers/staging/Kconfig | sed 's/^/  Kconfig: /'
          tail -2 drivers/staging/Makefile | sed 's/^/  Makefile: /'
          cd ../..

      - name: Set Release Info
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: rekernel
        run: |
          cd kernel/msm-5.4
          curl -LSs 'https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_patches.sh' -o rekernel_patches.sh
          chmod +x rekernel_patches.sh
          bash rekernel_patches.sh || echo 'rekernel_patches 有非致命错误, 继续'
          mkdir -p drivers/rekernel
          curl -LSs 'https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_extra.patch' -o rekernel_extra.patch
          patch -p1 < rekernel_extra.patch || true

      - name: Compile Kernel
        run: |
          set -o pipefail
          export PATH="$(pwd)/compiler/clang-bin/bin:$PATH"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CLANG_PATH="$(pwd)/compiler/clang-bin/bin"
          export ARCH=arm64
          export SUBARCH=arm64
          cd kernel/msm-5.4
          echo '===== 添加 docker 补丁 ====='
          rm -f fs/overlayfs/util.c
          curl -LSs 'https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/util.c' -o fs/overlayfs/util.c
          rm -f kernel/module.c
          curl -LSs 'https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/module.c' -o kernel/module.c
          rm -f include/linux/sched/user.h
          curl -LSs 'https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch' -o 001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch
          curl -LSs 'https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/user.h' -o include/linux/sched/user.h
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch || echo 'sysvipc 补丁有非致命错误'
          echo '===== docker 补丁完成 ====='
          sed -i 's/obj-$(CONFIG_KPROBES)/obj-y/g' kernel/Makefile || true
          echo '===== 生成配置 ====='
          make O=out CC=clang LLVM=1 9rt_defconfig
          echo '===== 打开 QCA WLAN 驱动 ====='
          ./scripts/config --file out/.config -e CONFIG_QCA_CLD_WLAN
          ./scripts/config --file out/.config --set-str CONFIG_QCA_CLD_WLAN_PROFILE default
          echo '===== 关闭 KSU ====='
          ./scripts/config --file out/.config -d CONFIG_KSU
          ./scripts/config --file out/.config -d CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --file out/.config -d CONFIG_KSU_TRACEPOINT_HOOK
          ./scripts/config --file out/.config -d CONFIG_KSU_SUSFS
          echo '===== Droidspaces / Docker 所需 (来自原流程) ====='
          ./scripts/config --file out/.config -e CONFIG_USER_NS -e CONFIG_PID_NS -e CONFIG_IPC_NS -e CONFIG_CHECKPOINT_RESTORE -e CONFIG_SYSVIPC -e CONFIG_KPROBES -e CONFIG_TMPFS_POSIX_ACL -e CONFIG_TMPFS_XATTR
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_PIDS --enable CONFIG_CGROUP_IO --enable CONFIG_CPUSETS --enable CONFIG_MEMCG --enable CONFIG_DEVTMPFS --enable CONFIG_DEVTMPFS_MOUNT --enable CONFIG_OVERLAY_FS
          echo '===== KSU 确认 ====='
          grep -E 'CONFIG_KSU' out/.config || echo '(无 KSU 配置 = 已关闭)'
          echo '===== 编译 ====='
          make O=out CC=clang LLVM=1 -j$(nproc) 2>&1 | tee /tmp/build.log
          RC=${PIPESTATUS[0]}
          echo "===================== make 退出码: $RC ====================="
          exit $RC

      - name: Package with AnyKernel3
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git .github README.md
          cp ../kernel/msm-5.4/out/arch/arm64/boot/Image .
          mkdir -p modules/vendor/lib/modules
          find ../kernel/msm-5.4/out -name '*.ko' -exec cp {} modules/vendor/lib/modules/ \; 2>/dev/null || true
          echo ".ko 数量: $(find modules/vendor/lib/modules -name '*.ko' | wc -l)"
          sed -i 's|^kernel.string=.*|kernel.string=Kernel 5.4.309 Docker for OnePlus 9RT (KSU disabled)|' anykernel.sh
          sed -i 's|^device.name1=.*|device.name1=martini|' anykernel.sh
          sed -i 's|^device.name2=.*|device.name2=OnePlus 9RT|' anykernel.sh
          sed -i 's|^block=.*|block=boot|' anykernel.sh
          sed -i 's|^do.modules=.*|do.modules=1|' anykernel.sh
          sed -i 's|^do.systemless=.*|do.systemless=0|' anykernel.sh
          grep -E 'kernel.string|device.name|^block=|do.modules|do.systemless' anykernel.sh
          zip -r9 ../AK3-9RT-Kernel-5.4.309-Docker.zip * -x '.git*' README.md '*placeholder'
          cd ..
          ls -lh AK3-*.zip

      - name: Pack Boot Image (no Magisk)
        run: |
          set -e
          mkdir -p boot_pack && cd boot_pack
          echo '=== 原厂 boot.img ==='
          curl -fL 'https://github.com/one899/android_kernel_oneplus_sm8350_5.4.309/releases/download/stock-boot-martini/boot.img' -o boot_origin.img
          ls -lh boot_origin.img
          wget -q https://raw.githubusercontent.com/miaizhe/magiskboot-linux/refs/heads/main/x86_64/magiskboot
          chmod +x magiskboot
          ./magiskboot unpack boot_origin.img
          ls -la
          rm -f kernel
          cp ../kernel/msm-5.4/out/arch/arm64/boot/Image kernel
          ./magiskboot repack boot_origin.img ../boot-9RT-Kernel-5.4.309-Docker.img
          cd ..
          ls -lh boot-*.img

      - name: Collect wlan.ko
        run: |
          set -e
          echo '=== 找 wlan.ko ==='
          find kernel/msm-5.4/out -name 'wlan.ko' -o -name '*wlan*.ko' | head -20
          WK=$(find kernel/msm-5.4/out -name 'wlan.ko' | head -1)
          if [ -z "$WK" ]; then
            echo 'FAIL: 没找到 wlan.ko'
            echo '--- out 里所有 .ko ---'
            find kernel/msm-5.4/out -name '*.ko' | head -30
            exit 1
          fi
          echo "找到: $WK"
          cp "$WK" qca_cld3_wlan.ko
          ls -lh qca_cld3_wlan.ko
          echo '=== vermagic 检查 ==='
          strings qca_cld3_wlan.ko | grep -m1 vermagic

      - name: Check Result
        run: |
          ls -lh kernel/msm-5.4/out/arch/arm64/boot/Image
          ls -lh AK3-*.zip boot-*.img qca_cld3_wlan.ko

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: 9RT-Kernel-5.4.309-Docker
          path: |
            kernel/msm-5.4/out/arch/arm64/boot/Image
            AK3-9RT-Kernel-5.4.309-Docker.zip
            boot-9RT-Kernel-5.4.309-Docker.img
            qca_cld3_wlan.ko
          if-no-files-found: warn
